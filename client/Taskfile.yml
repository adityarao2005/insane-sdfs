version: '3'

tasks:
  default:
    desc: Show available client tasks
    cmds:
      - task --list
    silent: true
  
  install:
    desc: Install client dependencies
    cmds:
      - bun install

  proto:
    desc: Regenerate TypeScript protobuf and gRPC stubs
    cmds:
      - bun proto:create
    deps:
      - install

  test:
    desc: Test the client
    cmds:
      - bun test
    deps:
      - proto

  