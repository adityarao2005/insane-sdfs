# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Show available client tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install node dependencies for the TypeScript gRPC client
    cmds:
      - bun install

  proto:
    desc: Generate TypeScript code from ../proto/HelloService.proto
    cmds:
      - bun run proto:create
    deps:
      - install

  run:
    desc: Run the gRPC client once
    cmds:
      - GRPC_SERVER_ADDRESS="localhost:8080" NAME="Aditya" bun run src/index.ts
    deps:
      - proto
      - install